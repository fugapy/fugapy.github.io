<!doctype html><html lang="es-PY"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Cómputo FUGA · Demo</title><link rel="icon" href="/recursos/logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap"><link data-client-styles rel="stylesheet" href="/computo/recursos/app.css?v=r07"><script src="/computo/motor.js"></script><script src="/computo/recursos/app.js?v=r07" defer></script></head><body><style>.demo-beta{position:sticky;top:0;z-index:50;background:#f2c200;color:#111;font:600 13px/1.45 Manrope,system-ui,sans-serif;padding:8px 14px;text-align:center}.demo-beta b{font-weight:800}</style><div class="demo-beta" role="note"><b>DEMO EN BETA</b> · Disponible un solo día: hasta el miércoles 18/11 a las 10:15. Los números son orientativos: el cómputo final lo revisa un profesional.</div><div id="root"></div><template id="legacy-template">
<header class="cabecera">
  <img class="logo" src="/recursos/logo.svg" alt="FUGA" width="56" height="56">
  <p class="etiqueta"><span class="cuadro" aria-hidden="true"></span>TECH <span class="sep">CÓMPUTO</span> <span class="sep">ASUNCIÓN</span></p>
</header>

<main>
  <section class="intro">
    <h1>Cómputo métrico<br>desde tu plano</h1>
    <p class="beta"><span class="etiqueta-chica"><span class="cuadro cuadro-beta" aria-hidden="true"></span>Beta</span>
      Este link es para probar la herramienta. Se va actualizando acá mismo: lo que corrijamos te llega sin que hagas nada. Si un número
      no te cierra o se te ocurre una mejora, dejala en <a href="#sugerencias">Sugerencias</a>, al final de la página.</p>
    <p class="saludo" id="saludo">Cargando tu acceso…</p>
  </section>

  <section class="reglas" id="reglas" hidden>
    <h2>Reglas de uso</h2>
    <div id="reglas-texto"></div>
    <label class="acepto"><input type="checkbox" id="acepto"> Leí las reglas y las acepto</label>
    <button type="button" class="boton" id="entrar" disabled>Entrar</button>
  </section>

  <section class="carga" id="carga" hidden>
    <label class="zona" id="zona" for="archivo">
      <span class="zona-titulo">Subí el plano</span>
      <span class="zona-texto">DWG o DXF, tal como lo tenés. Arrastralo acá o tocá para elegirlo.</span>
      <span class="zona-nube">¿Está en OneDrive o Google Drive y no se deja elegir? Abrilo una vez en AutoCAD, o en el Explorador hacé clic
        derecho → «Mantener siempre en este dispositivo».</span>
      <input type="file" id="archivo" accept=".dwg,.dxf" hidden>
    </label>
    <div class="opciones">
      <label for="unidad" class="etiqueta-chica">Unidad del dibujo</label>
      <select id="unidad">
        <option value="">Automática (si no coincide con el archivo, te aviso)</option>
        <option value="m">Metros</option>
        <option value="cm">Centímetros</option>
        <option value="mm">Milímetros</option>
      </select>
      <p class="nota">Tu plano se borra apenas termina el cómputo.</p>
    </div>
  </section>

  <section class="progreso" id="progreso" hidden aria-live="polite">
    <div class="barra"><span id="barra"></span></div>
    <p id="progreso-texto">Subiendo…</p>
  </section>

  <section class="error" id="error" hidden role="alert"></section>

  <section class="resultado" id="resultado" hidden>
    <div class="marca" id="marca" aria-hidden="true"></div>
    <div class="resumen" id="resumen"></div>
    <div id="faltas"></div>
    <div id="sectores"></div>
    <div id="extras"></div>
  </section>

  <!-- supuestos -->
  <section class="supuestos" id="supuestos" hidden>
    <h2>Supuestos</h2>
    <p>Lo que el plano no dice y la herramienta supone. Cambialo y tocá «Recalcular»: no hace falta volver a subir el plano.</p>
    <div id="supuestos-lista"></div>
    <div class="supuestos-pie">
      <button type="button" class="boton" id="recalcular" disabled>Recalcular</button>
      <p class="nota" id="supuestos-estado" aria-live="polite"></p>
    </div>
  </section>
  <!-- fin supuestos -->

  <section class="planos" id="planos" hidden>
    <h2>Planos desde tu croquis</h2>
    <p>Subí una foto de un croquis con medidas, de un boceto a mano o tu planta en AutoCAD, y te devolvemos la planta acotada, cortes,
      fachada, techo y cómputo, dibujados en AutoCAD (PDF y DWG). Con un boceto sin medidas, las medidas son propuestas y te marcamos qué
      confirmar. Lo revisamos antes de entregártelo: lo tenés en el día.</p>
    <div class="planos-form">
      <fieldset class="planos-tipo">
        <legend class="etiqueta-chica">Qué vas a subir</legend>
        <label><input type="radio" name="tipo-plano" value="croquis" checked> Croquis con medidas</label>
        <label><input type="radio" name="tipo-plano" value="boceto"> Boceto a mano</label>
        <label><input type="radio" name="tipo-plano" value="dwg"> Planta en AutoCAD (DWG o DXF)</label>
      </fieldset>
      <label for="obra-plano" class="etiqueta-chica">Nombre de la obra</label>
      <input type="text" id="obra-plano" maxlength="80" placeholder="Por ejemplo: Casa Benítez">
      <label class="boton secundario" for="archivo-plano" id="elegir-plano">Elegir archivo</label>
      <input type="file" id="archivo-plano" accept=".jpg,.jpeg,.png,.webp,.pdf" hidden>
      <span class="nota" id="nombre-archivo-plano"></span>
      <label class="acepto"><input type="checkbox" id="acepto-plano"> Entiendo que el archivo se guarda hasta entregarte los planos y se borra
        a los 7 días</label>
      <button type="button" class="boton" id="enviar-plano" disabled>Enviar</button>
      <p class="nota" id="estado-plano" aria-live="polite"></p>
    </div>
    <div id="pedidos-plano"></div>
  </section>

  <section class="sugerencias" id="sugerencias" hidden>
    <h2>Sugerencias</h2>
    <p>Estás probando una versión en desarrollo. Si algo salió mal, falta un rubro, un texto no se entiende o se te ocurre una mejora,
      escribilo acá: lo leemos todo y la herramienta se ajusta con eso.</p>
    <label for="sugerencia" class="etiqueta-chica">Tu sugerencia</label>
    <textarea id="sugerencia" rows="4" maxlength="2000" placeholder="Por ejemplo: en mi plano no leyó las ventanas del baño"></textarea>
    <div class="sugerencia-pie">
      <button type="button" class="boton" id="enviar-sugerencia" disabled>Enviar sugerencia</button>
      <p class="nota" id="sugerencia-estado" aria-live="polite"></p>
    </div>
  </section>
</main>

<footer class="pie">
  <p>PENSAMOS CIUDAD. HACEMOS COSAS.</p>
  <p><a href="#" id="ver-reglas">Reglas de uso</a> · <a href="https://wa.me/595971857198?text=Hola%20FUGA%2C%20vengo%20del%20c%C3%B3mputo" rel="noopener">Hagamos algo</a> · @FUGA.PY</p>
</footer>
<p class="sin-impresion">Este cómputo se ve solo en pantalla.</p>
</template></body></html>
